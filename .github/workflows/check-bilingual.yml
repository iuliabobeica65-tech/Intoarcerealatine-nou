name: Verify bilingual site build
on:
  push:
    branches: [preview-site-bilingv-en-2026-11-21]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bilingual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Cloudflare output
        run: node scripts/build-cloudflare.mjs
      - name: Check bilingual SEO, GEO and consent
        run: node scripts/check-bilingual.mjs
