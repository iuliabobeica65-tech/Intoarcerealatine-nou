settings:
  content:
    merge: true
# Editor de continut — pagina publica nu se schimba pana la publicarea aprobata.
media:
  input: assets
  output: /assets
  extensions: [png, jpg, jpeg, webp]
content:
  - name: articole
    label: "Articole — scrie, salvează, publică"
    type: collection
    path: editorial/articole
    exclude: [".gitkeep"]
    format: json
    filename: "{primary}.json"
    operations: { create: true, rename: false, delete: false }
    view:
      fields: [titlu, data, publicat]
      primary: titlu
      sort: [data, titlu]
      default:
        sort: data
        order: desc
    fields:
      - { name: titlu, label: Titlul articolului, type: string, required: true }
      - { name: descriere, label: Rezumatul afișat în lista de articole, type: text, required: true }
      - { name: data, label: Data publicării (AAAA-LL-ZZ), type: date, required: true }
      - { name: categorie, label: Tema articolului (opțional), type: string }
      - { name: imagine, label: Fotografia articolului (opțional), type: image }
      - { name: seo_titlu, label: Titlu SEO separat (opțional), type: string }
      - { name: seo_descriere, label: Descriere SEO separată (opțional), type: text }
      - name: continut
        label: Conținutul articolului — editor vizual
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          media: false
      - name: publicat
        label: "Publică articolul pe website? (debifat = ciornă)"
        type: boolean
        description: "Debifat: articolul nu apare pe site și nu intră în pachetul public. Bifează numai după verificarea textului."
  - name: setari_site
    label: "Setări generale — nume, meniu, contact"
    type: file
    operations: { create: false, rename: false, delete: false }
    path: content/setari-site.json
    format: json
    fields:
      - { name: brand, label: Numele afișat al site-ului, type: string }
      - { name: subtitlu_brand, label: Numele afișat sub siglă, type: string }
      - name: meniu
        label: Etichetele meniului
        type: object
        list:
          min: 8
          max: 8
          collapsible:
            collapsed: true
            summary: "{eticheta}"
        description: Editează doar eticheta vizibilă; adresa internă a paginii este protejată.
        fields:
          - { name: pagina, label: Fișier intern al paginii, type: string, readonly: true }
          - { name: eticheta, label: Textul afișat în meniu, type: string }
      - { name: mesaj_subsol, label: Mesajul informativ din subsol, type: text }
      - { name: email_contact, label: Adresa de e-mail de contact, type: string }
      - { name: whatsapp_contact, label: Numărul WhatsApp internațional (fără spații), type: string }
  - name: homepage
    label: Prima pagină — texte și butoane
    type: file
    operations: { create: false, rename: false, delete: false }
    path: content/acasa.json
    format: json
    fields:
      - { name: titlu, label: Titlul principal, type: string }
      - { name: subtitlu, label: Textul de sub titlu, type: text }
      - { name: text_hero_continuare, label: Continuarea mesajului despre blocaj, type: text }
      - { name: contact_titlu, label: Titlul invitației la dialog, type: string }
      - { name: contact_text, label: Textul invitației la dialog, type: text }
      - { name: contact_buton, label: Textul butonului de contact, type: string }
      - { name: contact_link, label: Linkul butonului de contact, type: string }
      - { name: fotografie, label: Fotografia de pe prima pagină, type: image }
      - { name: titlu_recunoastere, label: Titlul situațiilor, type: string }
      - { name: text_recunoastere, label: Introducerea situațiilor, type: text }
      - { name: buton_principal, label: Text buton principal, type: string }
      - { name: link_principal, label: Link buton principal, type: string }
      - { name: buton_secundar, label: Text buton secundar, type: string }
      - { name: link_secundar, label: Link buton secundar, type: string }
      - name: oferte
        label: Cele trei modalități de lucru
        type: object
        list:
          min: 3
          max: 3
          collapsible:
            collapsed: true
            summary: "{titlu}"
        description: Păstrează cele trei oferte existente. Ordinea lor este ordinea afișării.
        fields:
          - { name: titlu, label: Titlu, type: string }
          - { name: text, label: Prezentare, type: text }
          - { name: buton, label: Text buton, type: string }
          - { name: link, label: Link buton, type: string }
      - name: situatii
        label: Situații în care o femeie se poate recunoaște
        type: object
        list:
          min: 4
          max: 4
          collapsible:
            collapsed: true
            summary: "{titlu}"
        description: Patru situații scrise delicat. Nu afirma că toate femeile le trăiesc.
        fields:
          - { name: titlu, label: Titlul situației, type: string }
          - { name: text, label: Descriere, type: text }
      - { name: exemplu_titlu, label: Titlul exemplului practic, type: string }
      - name: exemplu_paragrafe
        label: Cele trei paragrafe ale exemplului
        type: text
        list: true
        description: Exemplu ilustrativ, nu testimonial. Păstrează trei paragrafe.
      - { name: despre_titlu, label: Titlul prezentării Iuliei, type: string }
      - { name: despre_text, label: Textul prezentării Iuliei, type: text }
      - name: carusel
        label: Legendele celor șapte imagini
        description: Modifică doar textele de sub imagini. Fișierele vizuale originale rămân neschimbate.
        type: object
        list:
          min: 7
          max: 7
          collapsible:
            collapsed: true
            summary: "{titlu}"
        fields:
          - { name: titlu, label: Titlul imaginii, type: string }
          - { name: descriere, label: Explicația de sub imagine, type: text }
